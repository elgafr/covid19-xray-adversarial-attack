name: Deploy Documentation with Jupyter Integration

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'notebooks/**'
      - 'results/figures/**'
      - 'journal/**'
      - '.github/workflows/docs*.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Sync notebooks, figures, and journal artifacts
        run: |
          chmod +x docs/sync_docs.sh
          ./docs/sync_docs.sh

      - name: Build documentation
        run: |
          mkdocs build -f docs/mkdocs.yml --strict --verbose -d ../site
        env:
          CI: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
