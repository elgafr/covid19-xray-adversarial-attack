{% extends "base.html" %}

{% block announce %}
  <style>
    .md-announce {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: 600;
    }
    .md-announce a {
      color: white !important;
      text-decoration: underline;
      font-weight: 700;
    }
    .md-announce a:hover {
      color: #ffd700 !important;
    }
  </style>
  Published in <b>JEEEMI Vol. 8, No. 2, April 2026 (pp. 769–788)</b> —
  <a href="https://doi.org/10.35882/jeeemi.v8i2.1506" target="_blank">
    DOI: 10.35882/jeeemi.v8i2.1506 →
  </a>
{% endblock %}

{% block content %}
{% if page.nb_url %}
    <a href="{{ page.nb_url }}" title="Download Notebook" class="md-content__button md-icon">
        {% include ".icons/material/download.svg" %}
    </a>
{% endif %}

{{ super() }}
{% endblock content %}
